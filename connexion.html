<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopify - Connexion</title>
    <link rel="stylesheet" href="Dossier CSS/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <a href="index.html" class="back-home"><i class="fa-solid fa-arrow-left"></i> Retour</a>
                <h1><i class="fa-solid fa-shop"></i> Shopify</h1>
                <h2>Connexion</h2>
                <p>Bienvenue ! Connectez-vous à votre compte</p>
            </div>

            <div class="social-login">
                <button type="button" class="social-btn google" onclick="alert('Connexion avec Google (démo)')">
                    <i class="fa-brands fa-google"></i> Google
                </button>
                <button type="button" class="social-btn facebook" onclick="alert('Connexion avec Facebook (démo)')">
                    <i class="fa-brands fa-facebook-f"></i> Facebook
                </button>
                <button type="button" class="social-btn apple" onclick="alert('Connexion avec Apple (démo)')">
                    <i class="fa-brands fa-apple"></i> Apple
                </button>
            </div>

            <div class="divider">
                <span>ou</span>
            </div>

            <form id="loginForm">
                <div class="input-group">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="loginEmail" placeholder="Email" required>
                </div>
                <div class="input-group">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="loginPassword" placeholder="Mot de passe" required>
                    <i class="fa-solid fa-eye-slash toggle-password"></i>
                </div>

                <div class="form-options">
                    <label class="checkbox">
                        <input type="checkbox"> Se souvenir de moi
                    </label>
                    <a href="#" class="forgot-password">Mot de passe oublié ?</a>
                </div>

                <button type="submit" class="auth-btn">Se connecter</button>

                <p class="auth-footer">
                    Pas encore de compte ? <a href="Inscription.html">Créer un compte</a>
                </p>
            </form>
        </div>
    </div>

    <script>
        // Toggle password visibility
        document.querySelector('.toggle-password')?.addEventListener('click', function() {
            const input = this.previousElementSibling;
            if (input.type === 'password') {
                input.type = 'text';
                this.classList.remove('fa-eye-slash');
                this.classList.add('fa-eye');
            } else {
                input.type = 'password';
                this.classList.remove('fa-eye');
                this.classList.add('fa-eye-slash');
            }
        });

        // Formulaire de connexion
        document.getElementById('loginForm')?.addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('loginEmail')?.value || '';
            
            if (!email) {
                alert('Veuillez entrer votre email');
                return;
            }
            
            alert('Connexion réussie ! Bienvenue sur Shopify !');
            window.location.href = 'acceuil.html';
        });
    </script>
</body>
</html>
